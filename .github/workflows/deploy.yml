name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_COPILOT_INTEGRATION_TOKEN: ${{ secrets.COPILOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run real Copilot integration test
        run: python -m pytest backend/tests/test_agent_service.py -k real_copilot_service_smoke

  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        component:
          - frontend
          - backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$DOCKER_USERNAME/onmyway-${{ matrix.component }}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "./${{ matrix.component }}"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs:
      - agent-integration
      - build
    runs-on: ubuntu-latest
    env:
      AZURE_HOST: ${{ secrets.AZURE_HOST }}
      AZURE_SSH_USER: ${{ secrets.AZURE_SSH_USER }}
      AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$AZURE_HOST"
          test -n "$AZURE_SSH_USER"
          test -n "$AZURE_SSH_PRIVATE_KEY"
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_TOKEN"
          test -n "$DB_PASSWORD"
          test -n "$COPILOT_TOKEN"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy FE and BE
        run: |
          SSH_TARGET="${AZURE_SSH_USER}@${AZURE_HOST}"
          echo "$DOCKER_TOKEN" | ssh "$SSH_TARGET" "docker login -u '$DOCKER_USERNAME' --password-stdin"
          ssh "$SSH_TARGET" \
            "DOCKER_USERNAME='$DOCKER_USERNAME' IMAGE_TAG='$GITHUB_SHA' DB_PASSWORD='$DB_PASSWORD' COPILOT_TOKEN='$COPILOT_TOKEN' AZURE_HOST='$AZURE_HOST' bash -s" <<'DEPLOY'
          set -e

          docker pull "$DOCKER_USERNAME/onmyway-backend:$IMAGE_TAG"
          docker pull "$DOCKER_USERNAME/onmyway-frontend:$IMAGE_TAG"

          docker network inspect onmyway-app >/dev/null 2>&1 || docker network create onmyway-app
          docker network connect onmyway-app onmyway-mysql 2>/dev/null || true

          docker rm -f onmyway-backend onmyway-frontend 2>/dev/null || true

          docker run -d \
            --name onmyway-backend \
            --restart unless-stopped \
            --network onmyway-app \
            --network-alias backend \
            -e APP_ENV=production \
            -e FRONTEND_ORIGIN="http://$AZURE_HOST" \
            -e DATABASE_PASSWORD="$DB_PASSWORD" \
            -e GITHUB_COPILOT_TOKEN="$COPILOT_TOKEN" \
            "$DOCKER_USERNAME/onmyway-backend:$IMAGE_TAG"

          docker run -d \
            --name onmyway-frontend \
            --restart unless-stopped \
            --network onmyway-app \
            -p 80:80 \
            "$DOCKER_USERNAME/onmyway-frontend:$IMAGE_TAG"

          curl --retry 15 --retry-delay 2 --retry-all-errors \
            --fail --silent --show-error http://127.0.0.1/api/health
          docker image prune -f
          DEPLOY

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519