name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        component:
          - frontend
          - backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$DOCKER_USERNAME/onmyway-${{ matrix.component }}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "./${{ matrix.component }}"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_HOST: ${{ secrets.AZURE_HOST }}
      AZURE_SSH_USER: ${{ secrets.AZURE_SSH_USER }}
      AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$AZURE_HOST"
          test -n "$AZURE_SSH_USER"
          test -n "$AZURE_SSH_PRIVATE_KEY"
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_TOKEN"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy FE and BE
        run: |
          SSH_TARGET="${AZURE_SSH_USER}@${AZURE_HOST}"
          echo "$DOCKER_TOKEN" | ssh "$SSH_TARGET" "docker login -u '$DOCKER_USERNAME' --password-stdin"
          ssh "$SSH_TARGET" '
            cd ~ &&
            docker compose pull backend frontend &&
            docker compose up -d backend frontend --wait &&
            curl --fail --silent --show-error http://127.0.0.1/api/health &&
            docker image prune -f
          '

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519