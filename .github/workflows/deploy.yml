name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_NAME: onmyway_test
      DATABASE_USER: onmyway_test
      DATABASE_PASSWORD: onmyway_test_password
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: onmyway_test_root_password
          MYSQL_DATABASE: onmyway_test
          MYSQL_USER: onmyway_test
          MYSQL_PASSWORD: onmyway_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ponmyway_test_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        component:
          - frontend
          - backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="$DOCKER_USERNAME/onmyway-${{ matrix.component }}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "./${{ matrix.component }}"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs:
      - build
      - backend-test
      - frontend-test
    runs-on: ubuntu-latest
    env:
      AZURE_HOST: ${{ secrets.AZURE_HOST }}
      AZURE_SSH_USER: ${{ secrets.AZURE_SSH_USER }}
      AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$AZURE_HOST"
          test -n "$AZURE_SSH_USER"
          test -n "$AZURE_SSH_PRIVATE_KEY"
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_TOKEN"
          test -n "$DB_PASSWORD"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy FE and BE
        run: |
          SSH_TARGET="${AZURE_SSH_USER}@${AZURE_HOST}"
          echo "$DOCKER_TOKEN" | ssh "$SSH_TARGET" "docker login -u '$DOCKER_USERNAME' --password-stdin"
          ssh "$SSH_TARGET" \
            "DOCKER_USERNAME='$DOCKER_USERNAME' IMAGE_TAG='$GITHUB_SHA' DB_PASSWORD='$DB_PASSWORD' AZURE_HOST='$AZURE_HOST' bash -s" <<'DEPLOY'
          set -e

          docker pull "$DOCKER_USERNAME/onmyway-backend:$IMAGE_TAG"
          docker pull "$DOCKER_USERNAME/onmyway-frontend:$IMAGE_TAG"

          docker network inspect onmyway-app >/dev/null 2>&1 || docker network create onmyway-app
          docker network connect onmyway-app onmyway-mysql 2>/dev/null || true

          docker rm -f onmyway-backend onmyway-frontend 2>/dev/null || true

          docker run -d \
            --name onmyway-backend \
            --restart unless-stopped \
            --network onmyway-app \
            --network-alias backend \
            -e APP_ENV=production \
            -e FRONTEND_ORIGIN="http://$AZURE_HOST" \
            -e DATABASE_PASSWORD="$DB_PASSWORD" \
            "$DOCKER_USERNAME/onmyway-backend:$IMAGE_TAG"

          docker run -d \
            --name onmyway-frontend \
            --restart unless-stopped \
            --network onmyway-app \
            -p 80:80 \
            "$DOCKER_USERNAME/onmyway-frontend:$IMAGE_TAG"

          curl --retry 15 --retry-delay 2 --retry-all-errors \
            --fail --silent --show-error http://127.0.0.1/api/health
          docker image prune -f
          DEPLOY

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519